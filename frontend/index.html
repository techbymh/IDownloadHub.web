<script>
const API = "https://idownloadweb-api.onrender.com";

const $ = id => document.getElementById(id);
const mb = b => b ? (b/1048576).toFixed(1) + " MB" : "";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

$("menuBtn").onclick = () => $("menu").classList.toggle("open");

async function go() {
  const url = $("u").value.trim();
  if (!url) return;
  const btn = $("btn");
  btn.disabled = true;
  $("out").innerHTML = "";
  $("msg").className = "msg";
  $("msg").textContent = "Fetching… the first request can take up to a minute.";
  try {
    const r = await fetch(`${API}/info?url=` + encodeURIComponent(url));
    const d = await r.json();
    if (!r.ok) {
      $("msg").className = "msg err";
      $("msg").textContent = typeof d.detail === "string" ? d.detail : "Something went wrong. Please try again.";
      return;
    }
    $("msg").textContent = "";
    const links = (d.items || []).map(i =>
      `<a class="dl" href="${esc(i.url)}" target="_blank" rel="noopener">
        <span>${i.kind === "audio" ? "🎵" : "🎬"}</span>
        <span class="m"><b>${i.kind === "audio" ? "Audio" : "Video"}</b> · ${esc(i.quality || "Standard")} · ${esc(i.ext)} ${mb(i.size)}</span>
        <span class="g">Download</span>
      </a>`).join("");
    $("out").innerHTML = `<div class="card">
      ${d.thumbnail ? `<img src="${esc(d.thumbnail)}" referrerpolicy="no-referrer" alt="">` : ""}
      <h3>${esc(d.title)}</h3>${links || "No downloadable formats found."}</div>`;
  } catch (e) {
    $("msg").className = "msg err";
    $("msg").textContent = "Could not reach the server. Please try again.";
  } finally {
    btn.disabled = false;
  }
}
$("btn").onclick = go;
$("u").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
</script>
